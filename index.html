<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tiro ao Pito</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a0a00">
</head>
<body>
<div id="wrapper">

  <!-- ── SPLASH ───────────────────────────────────────────────────────────── -->
  <div id="splash">
    <img src="criador.png" alt="Criador">
  </div>

  <!-- ── MENU ─────────────────────────────────────────────────────────────── -->
  <div id="menu" style="display:none;">

    <!-- Pitos nos ninhos (só imagem, sem pontos) -->
    <img class="menu-pito" id="mp-gordo"    src="gordo.png"    style="left:11%; top:72%;">
    <img class="menu-pito" id="mp-pito"     src="pito.png"     style="left:40%; top:45%;">
    <img class="menu-pito" id="mp-magro"    src="magro.png"    style="left:73%; top:55%;">
    <img class="menu-pito" id="mp-careca"   src="careca.png"   style="left:6%;  top:55%;">
    <img class="menu-pito" id="mp-cabeludo" src="cabeludo.png" style="left:70%; top:72%;">

    <!-- Recorde e botão jogar -->
    <div id="recordMenu"></div>
    <button id="btnJogar" onclick="startGame()">JOGAR</button>

  </div>

  <!-- Botão som (fora do menu, para também aparecer durante o jogo) -->
  <button id="btnSom" onclick="toggleSom()">🔊</button>

  <!-- ── ÁUDIOS ────────────────────────────────────────────────────────────── -->
  <audio id="introMusic" src="intro.mp3"></audio>
  <audio id="gameMusic"  src="feira.mp3" loop></audio>

  <!-- ── JOGO ──────────────────────────────────────────────────────────────── -->
  <div id="game" style="display:none;">
    <button id="btnPausa" onclick="pausar()" aria-label="Pausa">⏸</button>
    <div id="hud">
      <div class="hud-box">
        <span class="hud-label">PONTOS</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-box hud-nivel">
        <span class="hud-label">NÍVEL</span>
        <span class="hud-value" id="nivel">1</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">TEMPO</span>
        <span class="hud-value" id="time">30</span>
      </div>
    </div>
    <div id="vidasBar">
      <span id="vidas">🐣🐣🐣🐣🐣</span>
    </div>

    <!-- Overlay de transição entre níveis -->
    <div id="nivelOverlay" style="display:none;">
      <div id="nivelBox">
        <span id="nivelTexto">NÍVEL 2!</span>
        <span id="nivelSub"></span>
      </div>
    </div>
    <div id="combo"></div>
    <div id="metaBar">
      <div id="metaFill"></div>
      <span id="metaTexto">META</span>
    </div>
    <div id="mensagem"></div>
    <div id="flash"></div>

    <!-- Pausa -->
    <div id="pausaOverlay" style="display:none;">
      <div id="pausaBox">
        <h1>PAUSA</h1>
        <button onclick="retomar()">Continuar</button>
        <button class="secundario" onclick="sairParaMenu()">Menu</button>
      </div>
    </div>
  </div>

  <!-- ── FIM DO JOGO ───────────────────────────────────────────────────────── -->
  <div id="gameOver" style="display:none;">
    <div id="gameOverBox">
      <h1 id="gameOverTitulo">FIM DO JOGO!</h1>
      <strong><span id="finalScore">0</span> pts</strong>
      <p id="motivoTexto"></p>
      <p id="recordTexto"></p>
      <p id="detalheTexto"></p>
      <button onclick="jogarDeNovo()">Jogar de novo</button>
      <button class="secundario" onclick="sairParaMenu()">Menu</button>
    </div>
  </div>

</div><!-- /#wrapper -->
<script src="balanco.js"></script>
<script src="script.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  setTimeout(() => {
    const splash = document.getElementById("splash");
    splash.classList.add("splash-ocultar");
    setTimeout(() => {
      splash.style.display = "none";
      document.getElementById("menu").style.display = "block";
    }, 600);
  }, 5000);
</script>
</body>
</html>
